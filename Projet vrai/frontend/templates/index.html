<!DOCTYPE html>

        color: #fff;
        padding: 0.7em 2em;
        border-radius: 24px;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 2px 16px #0003;
        font-size: 1.2rem;
        z-index: 1000;
        transition: background 0.2s, transform 0.2s;
      }
      .don-btn-fixed:hover {
        background: #bfa13a;
        transform: scale(1.06);
      }
