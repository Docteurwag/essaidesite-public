<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lumen Christi TV Mobile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <style>
        .logo { width: 80px; height: 80px; border-radius: 40px; margin-bottom: 10px; }
        .menu-btn { background: #e0f2f1; border-radius: 8px; padding: 12px; margin: 6px; color: #00695c; font-weight: bold; display: inline-block; }
        .live-section { text-align: center; margin: 20px 0; }
        .live-title { font-size: 20px; font-weight: bold; color: #d32f2f; }
        .live-link { color: #1976d2; text-decoration: underline; margin-top: 8px; display: block; }
        .don-btn { position: fixed; bottom: 20px; right: 20px; background: #ff9800; border-radius: 30px; padding: 12px 24px; color: #fff; font-weight: bold; font-size: 16px; box-shadow: 0 2px 8px #0002; }
    </style>
</head>
<body style="background:#f9f9f9;">
    <div style="max-width:400px;margin:auto;padding:10px;">
        <!-- Logo et nom -->
        <div style="text-align:center;margin:20px 0;">
            <img src="https://lumenchristitv.com/logo.png" alt="Logo" class="logo">
            <h1 style="color:#00695c;font-size:24px;">Lumen Christi TV</h1>
        </div>
        <!-- Menus principaux -->
        <div style="text-align:center;">
            <a class="menu-btn" href="https://lumenchristitv.com/actualites">Actualités</a>
            <a class="menu-btn" href="https://lumenchristitv.com/formations">Formations</a>
            <a class="menu-btn" href="https://lumenchristitv.com/prieres">Prières</a>
            <a class="menu-btn" href="https://lumenchristitv.com/emissions">Emissions</a>
            <a class="menu-btn" href="https://lumenchristitv.com/programmes">Programmes</a>
            <a class="menu-btn" href="https://lumenchristitv.com/dioceses">Diocèses</a>
            <a class="menu-btn" href="https://lumenchristitv.com/a-propos">À propos</a>
        </div>
        <!-- Live Twitch intégré -->
        <div class="live-section">
            <span class="live-title">Live</span><br>
            <iframe src="https://player.twitch.tv/?channel=lumenchristitv2024&parent=localhost&parent=127.0.0.1&parent=lumenchristitv.com" frameborder="0" allowfullscreen="true" scrolling="no" height="200" width="100%"></iframe>
            <a class="live-link" href="https://www.twitch.tv/lumenchristitv2024" target="_blank">Regarder sur Twitch</a>
        </div>
        <!-- Menus vidéos -->
        <div style="text-align:center;">
            <a class="menu-btn" href="https://www.youtube.com/@lumenchristitvbenin">Vidéos</a>
            <a class="menu-btn" href="https://www.youtube.com/@lumenchristitvbenin/live">En direct</a>
            <a class="menu-btn" href="https://www.youtube.com/@lumenchristitvbenin">Podcasts</a>
            <a class="menu-btn" href="https://www.youtube.com/@lumenchristitvbenin/playlists">Playlists</a>
            <a class="menu-btn" href="https://www.youtube.com/@lumenchristitvbenin/community">Posts</a>
        </div>
        <!-- Playlist YouTube intégrée -->
        <div style="margin:20px 0;text-align:center;">
            <iframe width="100%" height="200" src="https://www.youtube.com/embed?listType=playlist&list=PLQw1xQw1xQw1xQw1xQw1xQw1xQw1xQw1x" title="Playlist Lumen Christi TV" frameborder="0" allowfullscreen></iframe>
        </div>
        <!-- Actualités dynamiques -->
        <div id="actus-list"></div>
    </div>
        <!-- Bouton don -->
        <a class="don-btn" href="https://lumenchristitv.com/don" target="_blank">Faire un don</a>
        <script>
        // Affichage dynamique des actualités depuis l'API Django
        fetch('http://127.0.0.1:8081/api/actualites/')
            .then(response => response.json())
            .then(data => {
                const actusList = document.getElementById('actus-list');
                actusList.innerHTML = '<h2 style="color:#00695c;">Actualités</h2>';
                data.forEach(actu => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style = 'background:#fff;border-radius:8px;box-shadow:0 2px 8px #0001;padding:1rem;margin-bottom:1rem;';
                    card.innerHTML = `<h3>${actu.titre}</h3><p>${actu.contenu}</p><small>${new Date(actu.date_pub).toLocaleString()}</small>`;
                    actusList.appendChild(card);
                });
            });
        </script>
</body>
</html>
